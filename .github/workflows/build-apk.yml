name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner already ships the Android SDK; just accept its licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install, test and build the web app
        run: |
          npm ci
          npm test
          npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hisab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hisab-apk
          path: hisab.apk

      # A rolling "latest" release so the APK can be downloaded straight on the phone.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest hisab.apk --title "Hisab (latest build)" --notes "Debug APK built from ${GITHUB_SHA::7}. Download hisab.apk on your Android phone and install it." --prerelease
